{% extends "base.html" %}
{% block contenido %}
<h2>{{ 'Editar' if producto else 'Nuevo' }} producto</h2>
<form method="POST" class="formulario">
  <label>Código</label>
  <input type="text" name="codigo" value="{{ producto.codigo if producto else '' }}" required>
  <label>Nombre</label>
  <input type="text" name="nombre" value="{{ producto.nombre if producto else '' }}" required>
  <label>Precio de compra</label>
  <input type="number" step="0.01" name="precio_compra" value="{{ producto.precio_compra if producto else '' }}" required>
  <label>Precio de venta</label>
  <input type="number" step="0.01" name="precio_venta" value="{{ producto.precio_venta if producto else '' }}" required>
  <label>Stock</label>
  <input type="number" name="stock" value="{{ producto.stock if producto else 0 }}" required>
  <label>Stock mínimo</label>
  <input type="number" name="stock_minimo" value="{{ producto.stock_minimo if producto else 5 }}" required>
  <label>Fecha de vencimiento (opcional)</label>
  <input type="date" name="fecha_vencimiento" value="{{ producto.fecha_vencimiento if producto and producto.fecha_vencimiento else '' }}">
  <label>Categoría</label>
  <select name="id_categoria">
    {% for c in categorias %}
    <option value="{{ c.id_categoria }}" {{ 'selected' if producto and producto.id_categoria == c.id_categoria }}>{{ c.nombre_categoria }}</option>
    {% endfor %}
  </select>
  <label>Proveedor</label>
  <select name="id_proveedor">
    {% for pr in proveedores %}
    <option value="{{ pr.id_proveedor }}" {{ 'selected' if producto and producto.id_proveedor == pr.id_proveedor }}>{{ pr.razon_social }}</option>
    {% endfor %}
  </select>
  <button type="submit">Guardar</button>
  <a class="btn" href="{{ url_for('productos') }}">Cancelar</a>
</form>
{% endblock %}
